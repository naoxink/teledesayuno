<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledesayuno</title>
    <!-- SDK de Ably para navegador -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        /* ====== TEMA VISUAL (VS Code / Dark+) ====== */
        :root {
            --bg: #1e1e1e;
            --surface: #252526;
            --text: #d4d4d4;
            --accent: #4fc1ff; /* Azul de variables de VS Code */
            --border: #3c3c3c;
            --msg-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --line-hover: rgba(255, 255, 255, 0.06);
            --font-mono: 'Consolas', 'Monaco', 'Menlo', 'Courier New', monospace;
        }

        /* Scrollbar (Firefox): <color-del-tirador> <color-de-la-pista> */
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg);
        }

        /* Scrollbar (WebKit/Blink) */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
            border: 2px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text);
        }

        /* ====== REAJUSTES DE TU CSS EXISTENTE ====== */
        body {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #login, #chat-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            max-width: 450px;
            margin: auto;
            width: 100%;
            box-sizing: border-box;
        }
        #chat-container {
            display: none;
            flex-direction: column;
            height: 100%;
            max-width: 100%;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }
        label { font-size: 0.8rem; margin-bottom: 4px; color: #888; }

        input, button {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        input:focus { border-color: var(--accent); outline: none; }
        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { opacity: 0.9; }
        #messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            background: var(--msg-bg);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: .9rem;
        }
        #messages.drag-over {
            border-color: var(--accent);
            border-style: dashed;
        }
        .msg {
            margin-bottom: 4px;
            padding: 1px 4px;
            border-radius: 3px;
            line-height: 1.25;
            word-break: break-word;
        }
        .msg:hover { background: var(--line-hover); }
        .msg .time { color: #555; font-size: 0.75rem; margin-right: 6px; }
        .msg .system { color: #777; font-style: italic; font-size: 0.8rem; }
        .msg-img {
            display: block;
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
            margin-top: 4px;
        }
        .reply-preview {
            display: none;
            border: 1px solid var(--accent);
            background: rgba(0,188,212,0.08);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            width: auto;
            max-width: calc(100% - 24px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reply-preview.visible {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .reply-preview strong { color: var(--accent); }
        .reply-preview .close-reply {
            cursor: pointer;
            color: var(--accent);
            font-weight: 700;
            flex-shrink: 0;
        }
        .reply-info {
            display: inline;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.9;
        }
        .msg.replying {
            background: rgba(0,188,212,0.08);
            border: 1px solid rgba(0,188,212,0.35);
        }
        .reply-block {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 6px;
            opacity: 0.92;
            font-size: 0.88rem;
            color: #cfd8dc;
        }
        .reply-block .reply-author {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .reply-block .reply-text {
            white-space: pre-wrap;
        }
        .reply-button {
            background: transparent;
            border: none;
            color: var(--text);
            opacity: 0.55;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 4px;
            font-size: 0.76rem;
            transition: opacity 0.15s ease, color 0.15s ease;
        }
        .reply-button:hover,
        .reply-button:focus {
            color: var(--accent);
            opacity: 0.9;
            text-decoration: none;
        }
        .msg:hover .reply-button {
            opacity: 0.85;
        }
        #input-area { display: flex; gap: 4px; position: relative; }
        #input-area input[type="text"] { flex: 1; }
        #attach-button {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: normal;
        }
        #mention-suggester {
            position: absolute;
            left: 0;
            right: auto;
            width: 100%;
            top: auto;
            bottom: calc(100% + 4px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,.12);
            max-height: 220px;
            overflow-y: auto;
            z-index: 20;
            font-size: 0.9rem;
        }
        .mention-item {
            padding: 8px 10px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.2s ease, color 0.2s ease;
        }
        .mention-item:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .mention-item.selected {
            background: rgba(0, 188, 212, 0.2);
            color: var(--accent);
            font-weight: 700;
        }
        .mention {
            color: var(--accent);
            font-weight: 700;
        }
        .clickable { cursor: pointer; }
        .mention.clickable:hover { text-decoration: underline; }
        .user.clickable { cursor: pointer; }
        .msg.mention-target {
            background: rgba(0, 188, 212, 0.12);
            border-left: 3px solid var(--accent);
            padding-left: 9px;
            margin-left: -9px;
        }
        .msg.mention-target .user {
            color: var(--accent);
        }
        #settings-controls {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #settings-toggle {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.9rem;
            line-height: 1;
            cursor: pointer;
        }
        #settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        #settings-modal[hidden] {
            display: none;
        }
        .settings-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: min(420px, 100%);
            padding: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .settings-row:last-child {
            margin-bottom: 0;
        }
        .settings-label {
            font-size: 0.95rem;
            color: var(--text);
        }
        .settings-switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
        }
        .settings-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .settings-slider {
            position: absolute;
            inset: 0;
            background: #5f5f5f;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .settings-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }
        .settings-switch input:checked + .settings-slider {
            background: var(--accent);
        }
        .settings-switch input:checked + .settings-slider::before {
            transform: translateX(18px);
        }
        body.app-blurred #login,
        body.app-blurred #chat-container {
            filter: blur(7px);
            transition: filter 0.2s ease;
        }

        /* Estado base del mensaje */
        .msg-item {
            opacity: 1;
            transform: scale(1);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        /* Forzamos el ocultamiento sin importar qué otra clase tenga el div */
        .msg-item.fade-out {
            opacity: 0 !important;
            transform: scale(0.95) !important;
        }

        /* Clase de limpieza rápida */
        .msg-item.fade-out.background-cleanup {
            transition: opacity 0.05s linear, transform 0.05s linear !important;
        }

        .disabled {
            opacity: .5;
        }

        /* Estado inicial: texto emborronado */
        .spoiler-text {
            filter: blur(5px);
            transition: filter 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        /* Estado al pasar el cursor (hover): el texto se vuelve legible */
        .spoiler-text:hover {
            filter: blur(0);
            user-select: auto;
        }

        /* ====== PANEL DE USUARIOS CONECTADOS (compacto y desplegable) ====== */
        #chat-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            height: 100%;
        }
        #user-toggle {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        #user-toggle:hover { background: var(--line-hover); }
        #user-toggle .dots { display: inline-flex; gap: 2px; }
        #user-toggle .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        #user-toggle .caret {
            opacity: 0.6;
            font-size: 0.7rem;
            transition: transform 0.15s ease;
        }
        #user-toggle[aria-expanded="true"] .caret {
            transform: rotate(180deg);
        }
        #user-panel {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            min-width: 160px;
            max-height: 40vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,.25);
            z-index: 30;
            padding: 4px;
        }
        #user-panel[hidden] { display: none; }
        #user-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #user-list li {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 0.85rem;
        }
        #user-list li:hover { background: var(--line-hover); }
        #user-list li .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        #user-list li .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        #user-list li.me .name::after {
            content: ' (tú)';
            font-weight: 400;
            opacity: 0.6;
        }
        .unread-bar {
            text-align: center;
            background-color: darkslategray;
        }
    </style>
</head>
<body>

    <div id="settings-controls">
        <button id="settings-toggle" type="button" title="Ajustes" onclick="abrirModalConfiguracion()">⚙</button>
    </div>

    <div id="settings-modal" hidden>
        <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h4 id="settings-title" style="margin:0; color:var(--accent);">Configuración</h4>
                <button type="button" onclick="cerrarModalConfiguracion()" aria-label="Cerrar ajustes">✕</button>
            </div>
            <div class="settings-row">
                <span class="settings-label">Permitir notificaciones</span>
                <label class="settings-switch">
                    <input id="setting-notifications" type="checkbox" onchange="toggleSetting('allowNotifications', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label">Sonido al recibir mensajes</span>
                <label class="settings-switch">
                    <input id="setting-sound" type="checkbox" onchange="toggleSetting('allowSound', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label">Cambio de título en mensajes nuevos</span>
                <label class="settings-switch">
                    <input id="setting-title" type="checkbox" checked onchange="toggleSetting('changeTitleOnNewMessages', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label">Contenido borroso al perder el foco</span>
                <label class="settings-switch">
                    <input id="setting-blur" type="checkbox" checked onchange="toggleSetting('blurContentOnFocusLoss', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label">Mensajes con autodestrucción</span>
                <label class="settings-switch">
                    <input id="setting-selfdestructMessages" type="checkbox" onchange="toggleSetting('selfdestructMessages', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div class="settings-row disabled">
                <span class="settings-label">Segundos de autodestrucción</span>
                <input id="setting-selfDestructSeconds" disabled="true" type="number" min="5" value="60" onchange="toggleSetting('selfDestructSeconds', this.value)">
            </div>
            <div class="settings-row">
                <span class="settings-label">Ocultar aliases</span>
                <label class="settings-switch">
                    <input id="setting-hide-aliases" type="checkbox" onchange="toggleSetting('hideAliases', this.checked)">
                    <span class="settings-slider"></span>
                </label>
            </div>
            <div style="text-align:right; margin-top:8px;">
                <button type="button" onclick="cerrarModalConfiguracion()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- ACCESO -->
    <div id="login" style="display: block;">
        <h4 style="margin: 0 0 12px 0; color: var(--accent);">Chat Privado P2P</h4>
        <div class="form-group" id="room-group">
            <label>ID de la Sala</label>
            <input type="text" id="room-id" placeholder="ej. sala-ocio">
        </div>

        <div id="room-preview" style="display: none; font-weight: bold; font-size: 1.1rem; color: var(--accent); margin-bottom: 12px;"></div>

        <div class="form-group">
            <label>Contraseña de Cifrado</label>
            <input type="password" id="password" placeholder="Clave secreta compartida" onkeypress="if (event.key === 'Enter') conectar()">
        </div>
        <button onclick="conectar()">Entrar</button>
    </div>

    <!-- PANEL DEL CHAT -->
    <div id="chat-container" style="display: none;">
        <div id="chat-main">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div>
                    <span id="room-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent);"></span>
                    <span style="font-size:0.75rem; color:#888; margin-left:8px;">Cifrado de extremo a extremo • Efímero</span>
                </div>
                <div style="position:relative;">
                    <button id="user-toggle" type="button" aria-expanded="false" onclick="toggleUserPanel()">
                        <span class="dots" id="user-toggle-dots"></span>
                        <span id="user-count">0 conectados</span>
                        <span class="caret">▾</span>
                    </button>
                    <div id="user-panel" hidden>
                        <ul id="user-list"></ul>
                    </div>
                </div>
            </div>
            <div id="messages"></div>
            <div id="reply-preview" class="reply-preview" hidden></div>
            <div id="input-area" class="chat-input-wrapper">
                <button id="attach-button" type="button" title="Adjuntar imagen" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" accept="image/*" hidden
                       onchange="if (this.files[0]) enviarImagen(this.files[0]); this.value='';">
                <input type="text" id="msg-input" placeholder="Mensaje seguro..." onkeypress="if(event.key==='Enter') enviar()">
                <div id="mention-suggester" class="mention-suggester" hidden></div>
                <button onclick="enviar()">Enviar</button>
            </div>
        </div>
    </div>

        function crearAudioDesdeBase64(base64Data) {
            try {
                const partes = base64Data.split(';base64,');
                const tipoMime = partes[0].split(':')[1];
                const byteCharacters = atob(partes[1]);
                const byteNumbers = new Array(byteCharacters.length);

                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }

                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: tipoMime });
                return new Audio(URL.createObjectURL(blob));
            } catch (e) {
                console.warn('Error al parsear el audio Base64:', e);
                return null;
            }
        }

        function insertarMention(alias) {
            const input = document.getElementById('msg-input');
            const caret = input.selectionStart;
            const before = input.value.slice(0, caret);
            const after = input.value.slice(caret);
            const match = before.match(/(?:^|\s)@([^\s@]*)$/);

            if (match) {
                // Estamos escribiendo una mención: reemplazarla
                const start = before.lastIndexOf('@');
                const replacement = before.slice(0, start) + '@' + alias + ' ';
                input.value = replacement + after;
                const newPos = replacement.length;
                input.focus();
                input.setSelectionRange(newPos, newPos);
            } else {
                // No estamos en una mención, añadir al final
                const newValue = input.value.trim() + (input.value.trim() ? ' ' : '') + '@' + alias + ' ';
                input.value = newValue;
                input.focus();
                input.setSelectionRange(newValue.length, newValue.length);
            }
            esconderMentionSuggester();
        }

            const query = match[1].trim().toLowerCase();

                .filter(alias => alias.toLowerCase().includes(query));

            // Añadir @room si coincide con la búsqueda
            if ('room'.includes(query)) {

                event.preventDefault();
                mentionNavigationActive = true;
                mentionIndex = (mentionIndex + 1) % mentionMatches.length;
                highlightMentionSuggester(mentionIndex);

                event.preventDefault();
                mentionNavigationActive = true;
                mentionIndex = (mentionIndex - 1 + mentionMatches.length) % mentionMatches.length;
                highlightMentionSuggester(mentionIndex);
            } else if (event.key === 'Enter') {
                if (mentionNavigationActive && mentionMatches[mentionIndex]) {
                    event.preventDefault();
                    insertarMention(mentionMatches[mentionIndex]);
                }
            } else if (event.key === 'Escape') {
                esconderMentionSuggester();
            }
        }

        // MOTOR CRIPTOGRÁFICO (Web Crypto API)
        async function generarClave(password, salaId) {
            const passwordBuffer = encoder.encode(password);
            const saltBuffer = encoder.encode(`salt-${salaId}`); // Salt único por sala
            const baseKey = await crypto.subtle.importKey("raw", passwordBuffer, "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: saltBuffer, iterations: 100000, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // Convierte bytes a base64 por bloques (el spread con payloads grandes desborda la pila)
        function bytesABase64(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(bin);
        }

        async function cifrarMensaje(texto, clave) {
            const iv = crypto.getRandomValues(new Uint8Array(12)); // IV de 12 bytes para AES-GCM
            const bufferCifrado = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, clave, encoder.encode(texto));
            return {
                msg: bytesABase64(new Uint8Array(bufferCifrado)),
                iv: bytesABase64(iv)
            };
        }

        async function descifrarMensaje(ciphertextBase64, ivBase64, clave) {
            try {
                const ciphertext = Uint8Array.from(atob(ciphertextBase64), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));
                const bufferDescifrado = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, clave, ciphertext);
                return decoder.decode(bufferDescifrado);
            } catch (e) {
                agregarMensajeSistema('< No se ha podido descifrar el mensaje. Clave inválida >');
                throw new Error("Clave inválida");
            }
        }

        // ====== IMÁGENES ======
        // Ably limita el mensaje a ~64 KB: comprimimos para que, tras JSON + AES-GCM + base64, quepa.
        async function comprimirImagen(file, maxLado = 1024, maxChars = 35000) {
            const bitmap = await createImageBitmap(file);
            let escala = Math.min(1, maxLado / Math.max(bitmap.width, bitmap.height));
            let calidad = 0.7;

            for (let i = 0; i < 10; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(bitmap.width * escala));
                canvas.height = Math.max(1, Math.round(bitmap.height * escala));
                const ctx = canvas.getContext('2d');
                // Fondo blanco: JPEG no admite transparencia (PNG con alfa saldrían en negro)
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', calidad);
                if (dataUrl.length <= maxChars) {
                    bitmap.close && bitmap.close();
                    return dataUrl;
                }
                escala *= 0.8;
                calidad = Math.max(0.4, calidad - 0.05);
            }
            bitmap.close && bitmap.close();
            throw new Error('la imagen es demasiado grande');
        }

        function animarYBorrar(elemento, usarLimpiezaFondo = false) {
            if (!elemento.parentNode || elemento.classList.contains('fade-out')) return;

            elemento.classList.add('fade-out');

            if (usarLimpiezaFondo) {
                elemento.classList.add('background-cleanup');
            }

            // Solo actuamos si la transición que terminó es del PROPIO elemento y es la de opacidad
            const alTerminarTransicion = (e) => {
                if (e.target === elemento && e.propertyName === 'opacity') {
                    elemento.removeEventListener('transitionend', alTerminarTransicion);
                    elemento.remove();
                }
            };
            elemento.addEventListener('transitionend', alTerminarTransicion);

            // Failsafe: si el navegador bloquea el evento, forzamos el borrado
            const tiempoSeguridad = usarLimpiezaFondo ? 100 : 1500;
            setTimeout(() => {
                if (elemento.parentNode) {
                    elemento.removeEventListener('transitionend', alTerminarTransicion);
                    elemento.remove();
                }
            }, tiempoSeguridad);
        }

                        }

                        if (settings.changeTitleOnNewMessages) {
                            document.title = `(${unreadCount}) ${tituloBase}`;
                        }

                        if (settings.allowSound) {
                            reproducirSonido();
                        }

                        if (settings.allowNotifications && window.Notification && Notification.permission === "granted") {
                            const notification = new Notification(`#${salaId} - ${datos.autor}`, {
                                body: datos.texto || (datos.imagen ? ETIQUETA_IMAGEN : ''),
                                tag: 'chat-notification',
                                renotify: true
                            });
                            notification.onclick = () => {
                                window.focus();
                                document.querySelector('#msg-input').focus();
                                notification.close();
                            };
                        }
                    }

                    agregarMensajePantalla(datos.autor, datos.texto, datos.replyTo ?? null, datos.id ?? null, datos.spoiler ?? false, datos.imagen ?? null);
                } catch (err) {
                    console.warn("Mensaje descartado: Clave incorrecta o manipulación de datos.");
                }
            });
        }

        async function enviar() {
            const input = document.getElementById('msg-input');
            const texto = input.value.trim();
            if (!texto || !canalGlobal) return;

            input.value = '';

            let textoMensaje = texto;

            const comandoEjecutado = ejecutarComandoSiHay(texto);
            if (!comandoEjecutado) {
                if (replyTarget) cancelarReply();
                return;
            }

            if (typeof comandoEjecutado === 'object' && comandoEjecutado.tipo === 'alias-change') {
                if (replyTarget) cancelarReply();
                await manejarCambioAlias(comandoEjecutado.aliasAntiguo, comandoEjecutado.aliasNuevo);
                return;
            }

            let isSpoiler = false;
            if (typeof comandoEjecutado === 'object' && comandoEjecutado.tipo === 'spoiler') {
                isSpoiler = true;
                textoMensaje = comandoEjecutado.texto;
            }

            if (typeof comandoEjecutado === 'string') {
                textoMensaje = comandoEjecutado;
            }

            const messageId = generarIdMensaje();
            const paqueteDatos = {
                id: messageId,
                autor: miAlias,
                spoiler: isSpoiler,
                texto: textoMensaje
            };

            if (replyTarget) {
                paqueteDatos.replyTo = {
                    id: replyTarget.id,
                    autor: replyTarget.autor,
                    texto: replyTarget.texto
                };
            }

            // Ciframos localmente antes de enviar a la red
            const payloadCifrado = await cifrarMensaje(JSON.stringify(paqueteDatos), claveCriptografica);

            canalGlobal.publish('msg', payloadCifrado);

            if (replyTarget) {
                cancelarReply();
            }
        }

        async function manejarCambioAlias(aliasAntiguo, aliasNuevo) {
            registrarCambioAlias(aliasAntiguo, aliasNuevo);

            if (canalGlobal) {
                const paqueteCambio = {
                    autor: aliasNuevo,
                    tipo: 'alias-change',
                    aliasAntiguo,
                    aliasNuevo
                };

                const payloadCifrado = await cifrarMensaje(JSON.stringify(paqueteCambio), claveCriptografica);
                canalGlobal.publish('msg', payloadCifrado);

                try {
                    canalGlobal.presence.leaveClient(aliasAntiguo);
                } catch (err) {
                    console.warn('No se pudo salir del alias antiguo:', err);
                }
                canalGlobal.presence.enterClient(aliasNuevo);

                canalGlobal.presence.get((err, members) => {
                    if (!err) {
                        actualizarMiembrosConectados(members);
                    }
                });
            }
            renderUserSidebar();
        }

        function desplazarAlFinalSiEnfocado(box) {
            // Si la ventana no tiene el foco, no movemos el scroll para poder leer lo perdido al volver.
            if (!tieneElFoco) return;
            box.scrollTop = box.scrollHeight;
        }

        function limpiarMensajesUsuario() {
            const box = document.getElementById('messages');
            const mensajes = Array.from(box.querySelectorAll('.msg'));

            mensajes.forEach(msg => {
                if (!msg.querySelector('.system')) {
                    msg.remove();
                }
            });

            eliminarBarraSinLeer();
            unreadCount = 0;
            document.title = tituloBase;
            box.scrollTop = box.scrollHeight;
        }

        function agregarMensajePantalla(autor, texto, replyTo = null, messageId = null, spoiler = false, imagen = null) {
            const box = document.getElementById('messages');
            const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            texto = texto || '';
            // Solo aceptamos data URLs de imagen bien formadas (evita inyección de HTML)
            const imagenValida = typeof imagen === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(imagen);
            const textoVisible = texto || (imagenValida ? ETIQUETA_IMAGEN : '');

            if (messageId) {
                mensajesPorId[messageId] = { id: messageId, autor, texto: textoVisible, replyTo, spoiler };
            }

            const colorAutor = obtenerColorPorAlias(autor);
            const esMio = (autor === miAlias);
            const esMencionado = contieneMiMencion(texto);
            const claseMensaje = esMencionado ? 'msg mention-target' : 'msg';
            const replyHtml = replyTo ? `
                <div class="reply-block">
                    <span class="reply-author">En respuesta a${settings.hideAliases ? '' : ' ' + escaparHTML(replyTo.autor)}:</span>
                    <span class="reply-text ${mensajesPorId[replyTo.id]?.spoiler ? 'spoiler-text' : ''}">${escaparHTML(replyTo.texto)}</span>
                </div>` : '';

            const msgElement = document.createElement('div');
            msgElement.className = `${claseMensaje} msg-item`;

            if (messageId) {
                msgElement.dataset.msgId = messageId;
            }

            let prompt = `[${escaparHTML(autor)}]`;
            let clickable = 'clickable';
            if (settings.hideAliases) {
                prompt = `⬤`;
                clickable = '';
            }

            const textoHtml = texto ? `<span class="${spoiler ? 'spoiler-text' : ''}">${resaltarMenciones(texto)}</span>` : '';
            const imagenHtml = imagenValida ? `<img class="msg-img" src="${imagen}" alt="Imagen enviada por ${escaparHTML(autor)}">` : '';

            msgElement.innerHTML = `
                ${replyHtml}
                <span class="time">${hora}</span>
                ${messageId ? `<button type="button" class="reply-button" title="Responder" data-msg-id="${escaparHTML(messageId)}">Resp</button>` : ''}
                <span class="user ${esMio ? 'own' : ''} ${clickable}" data-alias="${escaparHTML(autor)}" style="color: ${colorAutor}; font-weight: bold;">${prompt}:</span>
                ${textoHtml}
                ${imagenHtml}
            `;

            box.appendChild(msgElement);

            // La imagen carga de forma asíncrona y cambia la altura: reajustamos el scroll
            const img = msgElement.querySelector('.msg-img');
            if (img) {
                img.addEventListener('load', () => desplazarAlFinalSiEnfocado(box));
            }

            if (settings.selfdestructMessages) {
                const tiempoVida = settings.selfDestructSeconds * 1000;
                msgElement.dataset.expiresAt = Date.now() + tiempoVida;

                setTimeout(() => {
                    animarYBorrar(msgElement);
                }, tiempoVida);
            }

            desplazarAlFinalSiEnfocado(box);
        }

        function contieneMiMencion(texto) {
            if (!miAlias) return false;
            // @room siempre menciona al usuario
            if (/@room\b/i.test(texto)) return true;
            const aliasEscapado = miAlias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`@${aliasEscapado}(?=\\b)`, 'i');
            return regex.test(texto);
        }

        function resaltarMenciones(texto) {
            const textoEscapado = escaparHTML(texto);
            const aliases = [...new Set([miAlias, ...miembrosConectados].filter(Boolean))];

            // Primero reemplazamos @room
            let resultado = textoEscapado.replace(/@room\b/g, '<span class="mention clickable" data-alias="room">@room</span>');

            if (aliases.length === 0) {
                return resultado;
            }

            const patrones = aliases
                .sort((a, b) => b.length - a.length)
                .map(alias => escaparHTML(alias).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .join('|');

            const regex = new RegExp(`@(${patrones})(?=\\b)`, 'g');
            return resultado.replace(regex, '<span class="mention clickable" data-alias="$1">@$1</span>');
        }

        // insertAdjacentHTML en vez de innerHTML += : no destruye los nodos existentes
        // (con innerHTML += se perdían los listeners y los temporizadores de autodestrucción)
        function agregarMensajeSistema(texto) {
            const box = document.getElementById('messages');
            box.insertAdjacentHTML('beforeend', `<div class="msg"><span class="system">${texto}</span></div>`);
            desplazarAlFinalSiEnfocado(box);
        }

        function establecerReplyTarget(target) {
            if (replyTarget && replyTarget.id) {
                const prev = document.querySelector(`.msg[data-msg-id="${replyTarget.id}"]`);
                if (prev) prev.classList.remove('replying');
            }
            replyTarget = target;
            const preview = document.getElementById('reply-preview');
            preview.innerHTML = `
                <span class="close-reply" onclick="cancelarReply()">×</span>
                Respondiendo a ${settings.hideAliases ? '⬤' : escaparHTML(target.autor)}: <span class="reply-info">${escaparHTML(target.texto)}</span>
            `;
            preview.classList.add('visible');
            preview.hidden = false;
            if (target.id) {
                const targetMsg = document.querySelector(`.msg[data-msg-id="${target.id}"]`);
                if (targetMsg) targetMsg.classList.add('replying');
            }
        }

        function cancelarReply() {
            if (replyTarget && replyTarget.id) {
                const targetMsg = document.querySelector(`.msg[data-msg-id="${replyTarget.id}"]`);
                if (targetMsg) targetMsg.classList.remove('replying');
            }
            replyTarget = null;
            const preview = document.getElementById('reply-preview');
            preview.classList.remove('visible');
            preview.hidden = true;
            preview.innerHTML = '';
        }

        function generarIdMensaje() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return Array.from({ length: 16 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
        }

        function agregarBarraSinLeer() {
            const box = document.getElementById('messages');
            box.insertAdjacentHTML('beforeend', `<div class="unread-bar">Mensajes sin leer</div>`);
        }

        function eliminarBarraSinLeer() {
            const bar = document.querySelector('.unread-bar');
            if (bar) bar.remove();
        }

        // Escapa también comillas: los alias se insertan en atributos (data-alias="...")
        function escaparHTML(str) {
            return String(str ?? '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const ANIMALES_Y_COSA = ["Nutria", "Mapache", "Calamar", "Capibara", "Croqueta", "Pangolín", "Chistorra", "Paloma", "Gatito", "Keyup", "Churro", "Miniboss", "Jefe", "Manta", "Regleta", "Tiburón martillo"];
        const ADJETIVOS = ["espacial", "ninja", "radioactivo", "sideral", "táctico", "cuántico", "asesino", "chulapo", "anónimo", "con retraso", "aburrido", "excelente"];

        function generarAliasAleatorio() {
            const animal = ANIMALES_Y_COSA[Math.floor(Math.random() * ANIMALES_Y_COSA.length)];
            const adjetivo = ADJETIVOS[Math.floor(Math.random() * ADJETIVOS.length)];
            return `${animal} ${adjetivo}`;
        }

        // SELECCIÓN DE COLOR ADAPTATIVA (mismo alias -> mismo color siempre)
        function obtenerColorPorAlias(str) {
            const PALETA = [
                "#ef4444", // rojo
                "#f97316", // naranja
                "#eab308", // amarillo
                "#84cc16", // lima
                "yellowgreen",
                "#22c55e", // verde
                "#14b8a6", // turquesa
                "#06b6d4", // cian
                "#3b82f6", // azul
                "#6366f1", // índigo
                "#8b5cf6", // violeta
                "#a855f7", // púrpura
                "#d946ef", // fucsia
                "#ec4899", // rosa
                "#d1d5db", // gris plata brillante
                "#f59e0b", // ámbar
                "#34d399", // verde esmeralda claro
                "#2dd4bf", // turquesa eléctrico
                "#38bdf8", // azul cielo intenso
                "#818cf8", // índigo claro
                "#c084fc", // púrpura suave
                "#fb923c"  // naranja suave
            ];

            const alias = String(str ?? '').trim().toLowerCase();

            let hash = 0x811c9dc5;

            for (let i = 0; i < alias.length; i++) {
                hash ^= alias.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193);
            }

            return PALETA[(hash >>> 0) % PALETA.length];
        }

        function actualizarContador() {
            canalGlobal.presence.get((err, members) => {
                if (err) return console.error("Error al obtener presencia:", err);

                const conectados = members.length;
                const texto = ` ${conectados} conectado${conectados !== 1 ? 's' : ''}`;

                document.getElementById('user-count').innerText = texto;
            });
        }

        window.addEventListener('focus', () => {
            tieneElFoco = true;

            if (unreadCount > 0) {
                setTimeout(() => eliminarBarraSinLeer(), 3000);
            } else {
                eliminarBarraSinLeer();
            }

            unreadCount = 0;
            document.title = tituloBase;
            aplicarEstadoConfiguracion();
        });

        window.addEventListener('blur', () => {
            tieneElFoco = false;
            aplicarEstadoConfiguracion();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const box = document.getElementById('messages');
                const tiempoActual = Date.now();
                const mensajes = box.querySelectorAll('[data-expires-at]');

                mensajes.forEach(msg => {
                    const expiracion = parseInt(msg.dataset.expiresAt, 10);
                    if (tiempoActual >= expiracion) {
                        animarYBorrar(msg, true); // transición acelerada
                    }
                });
            }
        });
    </script>
</body>
</html>
